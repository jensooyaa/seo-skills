<!--
@case 页面概况：ld+json 用 @graph 包一层（Yoast / RankMath 的默认输出），类型要能取出来；坏掉的那段要记下解析失败
@fact structured.length 2
@fact structured.0.types.0 Organization
@fact structured.0.types.2 WebPage
@fact structured.0.types.3 CollectionPage
@fact structured.0.types.length 4
@fact structured.1.types.length 0
- title-missing
- canonical-missing
- og-incomplete
-->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>供应商准入标准与审核流程</title>
  <meta name="description" content="本页说明供应商准入的条件、需要提交的材料清单，以及从初审到最终评级的完整审核流程与时限要求。">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://example.com/audit/standard">
  <meta property="og:title" content="供应商准入标准与审核流程">
  <meta property="og:description" content="本页说明供应商准入的条件、需要提交的材料清单，以及从初审到最终评级的完整审核流程与时限要求。">
  <meta property="og:image" content="https://example.com/og.jpg">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@graph":[
    {"@type":"Organization","name":"SourcingX"},
    {"@type":"WebSite","url":"https://example.com/"},
    {"@type":["WebPage","CollectionPage"],"name":"准入标准"}
  ]}
  </script>
  <script type="application/ld+json">
  {"@type":"Product", "name":"缺了右花括号"
  </script>
</head>
<body>
  <header><a href="/">供应商门户</a></header>
  <nav><a href="/audit">审核流程</a> <a href="/faq">常见问题</a></nav>
  <main>
    <h1>供应商准入标准</h1>
    <h2>准入条件</h2>
    <p>需要提供营业执照与质量体系认证。</p>
  </main>
  <footer><p>© 2026 SourcingX 采购中心</p></footer>
</body>
</html>
